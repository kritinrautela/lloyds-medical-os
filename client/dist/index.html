<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C8102E' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 12h4l2-5 4 10 2-5h6'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Lloyds Medical OS</title>

    <!--
      Installed on Android from the clinic's own address. A member of staff
      opens http://<clinic-computer>:4000 on a tablet, chooses "Add to home
      screen", and it then opens full screen with its own icon like any other
      application. No app store, no separate build, nothing to pay for.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b2545" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1520" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lloyds Clinic" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      No web-font CDN by design. This system runs in clinics with no internet;
      a remote font request would hang and then fall back silently, so the
      typography is built on the platform UI stack (see index.css).
    -->
    <script type="module" crossorigin src="/assets/index-hOGTWFwf.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C5I2ePxt.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Registered only for a real build. Under the dev server it would cache
      // module output and serve stale code back during development.
      if ('serviceWorker' in navigator && location.port !== '5173') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js').catch(function () {
            // An install that cannot register a worker still runs as a normal
            // page over the clinic network, so this is not worth interrupting
            // anyone about.
          });
        });
      }
    </script>
  </body>
</html>
